<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>ModBananager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="sidebar">
    <div class="brand"><span class="brand-icon">🍌</span> ModBananager</div>

    <div class="side-label">
      <span>Games</span>
      <button id="addGameBtn" class="icon-btn" title="Add a game">+</button>
    </div>
    <ul id="gameList" class="game-list"></ul>

    <div class="side-foot">
      <label class="side-label" for="modIdInput">Open mod by id</label>
      <div class="row">
        <input id="modIdInput" type="text" placeholder="e.g. 452445" spellcheck="false">
        <button id="openModBtn" class="btn">Open</button>
      </div>
      <div class="hint">or <code>curl localhost:3000/add-mod/&lt;id&gt;</code></div>
    </div>
  </aside>

  <main id="main">
    <header class="topbar">
      <nav class="tabs">
        <button class="tab active" data-view="browse">Browse</button>
        <button class="tab" data-view="installed">Installed <span id="installedCount" class="count"></span></button>
      </nav>
      <div id="browseControls" class="browse-controls">
        <input id="searchInput" type="search" placeholder="Search mods for this game…" spellcheck="false">
        <select id="sortSelect" title="Sort">
          <option value="Generic_MostDownloaded">Most downloaded</option>
          <option value="Generic_MostLiked">Most liked</option>
          <option value="Generic_LatestUpdated">Recently updated</option>
          <option value="Generic_LatestModified">Recently modified</option>
          <option value="Generic_Newest">Newest</option>
          <option value="Generic_MostViewed">Most viewed</option>
        </select>
      </div>
      <div id="gameMeta" class="game-meta"></div>
    </header>

    <section id="view-browse" class="view">
      <div id="browseStatus" class="status-line"></div>
      <div id="modGrid" class="grid"></div>
      <div id="pager" class="pager hidden">
        <button id="prevPage" class="btn">‹ Prev</button>
        <span id="pageInfo"></span>
        <button id="nextPage" class="btn">Next ›</button>
      </div>
    </section>

    <section id="view-installed" class="view hidden">
      <div class="installed-head">
        <div id="installedPath" class="path"></div>
        <div class="row">
          <button id="openModFolderBtn" class="btn">Open folder</button>
          <button id="refreshInstalledBtn" class="btn">Refresh</button>
        </div>
      </div>
      <div id="installedStatus" class="status-line"></div>
      <div id="installedList" class="installed-list"></div>
    </section>

    <footer id="jobs" class="jobs hidden"></footer>
  </main>

  <!-- Mod detail slide-over -->
  <div id="detailOverlay" class="overlay hidden">
    <aside id="detail" class="detail-panel" aria-live="polite">
      <div class="detail-top">
        <button id="detailClose" class="icon-btn" title="Close (Esc)">✕</button>
      </div>
      <div id="detailBody" class="detail-body"></div>
    </aside>
  </div>

  <!-- Game add/edit dialog -->
  <div id="gameDialog" class="overlay hidden">
    <form id="gameForm" class="modal">
      <h2 id="gameFormTitle">Add game</h2>
      <label>GameBanana game id
        <div class="row">
          <input id="gfId" type="text" inputmode="numeric" placeholder="5855" required spellcheck="false">
          <button type="button" id="gfLookup" class="btn">Look up name</button>
        </div>
        <div class="hint">The number in <code>gamebanana.com/games/&lt;id&gt;</code></div>
      </label>
      <label>Name
        <input id="gfName" type="text" placeholder="Sonic Adventure 2" required>
      </label>
      <label>Layout
        <select id="gfLayout">
          <option value="modini">modini — SA Mod Loader style (folders with mod.ini)</option>
          <option value="ryujinx">ryujinx — romfs/exefs under modFolder/titleId</option>
        </select>
      </label>
      <label>Mod folder
        <div class="row">
          <input id="gfFolder" type="text" placeholder="D:\Games\…\mods" required spellcheck="false">
          <button type="button" id="gfBrowse" class="btn">Browse…</button>
        </div>
      </label>
      <label id="gfTitleIdRow" class="hidden">Title id
        <input id="gfTitleId" type="text" placeholder="0100f2c0115b6000" spellcheck="false">
      </label>
      <div id="gfError" class="error"></div>
      <div class="modal-actions">
        <button type="button" id="gfDelete" class="btn danger hidden">Remove game</button>
        <span class="spacer"></span>
        <button type="button" id="gfCancel" class="btn">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </div>

  <div id="lightbox" class="overlay hidden"><img id="lightboxImg" alt=""></div>

  <div id="toasts" class="toasts"></div>

  <script src="renderer.js"></script>
</body>
</html>
